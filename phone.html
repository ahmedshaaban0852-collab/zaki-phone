<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d14"><title>تفاصيل الهاتف | زكي فون</title><style>
:root{--bg:#080c12;--panel:#111925;--line:#253448;--text:#f1f6fc;--muted:#9eb0c5;--cyan:#27d7e8;--blue:#168cff;--green:#50d890}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#10233a 0,#080c12 48%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0 20px}.logo{font-size:clamp(23px,4vw,34px);font-weight:900}.logo span{color:var(--cyan)}.tag{color:var(--muted);font-size:13px}.hero{background:linear-gradient(120deg,#132b45,#111925 70%);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:clamp(24px,5vw,36px)}.hero p{color:#b9c9db;line-height:1.8;margin:0}.stats,.prices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stat,.pricebox{background:#0a1420;border:1px solid #263e55;border-radius:11px;padding:10px 12px}.stat b{display:block;font-size:20px;color:var(--cyan)}.stat small,.pricebox small{display:block;color:var(--muted);font-size:12px}.pricebox b{display:block;color:#7de6bd;font-size:17px;margin-top:4px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}.filters input,.filters select{width:100%;background:#0a111b;color:var(--text);border:1px solid #2b3c50;border-radius:10px;padding:12px;font:inherit;min-width:0}.resultsbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px;margin:12px 2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:linear-gradient(160deg,#141e2b,#0e151f);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0;transition:.15s}.card:hover{border-color:#248bd5;transform:translateY(-2px)}.brand{display:inline-block;background:#12324c;color:#7edbff;border-radius:7px;padding:4px 8px;font-size:12px;margin-bottom:9px}.phone-photo{display:block;width:100%;height:190px;object-fit:contain;background:#fff;border-radius:10px;margin:0 0 12px;padding:8px}.photo-search{font-size:12px;color:#9eb0c5;display:block;margin-top:-6px;margin-bottom:8px}.card h2{font-size:18px;margin:0 0 5px;overflow-wrap:anywhere}.series{color:var(--muted);font-size:13px;margin-bottom:8px}.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:#c3d0df}.pill{background:#202d3c;border-radius:7px;padding:5px 7px}.details{border-top:1px solid #263344;margin-top:12px;padding-top:10px;color:#c3d0df;font-size:13px;line-height:1.85;overflow-wrap:anywhere}.prices.compact{margin-top:9px}.prices.compact .pricebox{flex:1;min-width:110px;padding:8px}.prices.compact .pricebox b{font-size:15px}.btn{display:inline-block;background:#0b83f6;border:0;border-radius:10px;color:white;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.secondary{background:#202d3c}.notice,.note{background:#2a2111;border:1px solid #66502a;color:#f7dca5;padding:12px;border-radius:12px;line-height:1.8;font-size:13px;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:32px;display:none}.foot{text-align:center;color:#7f91a7;padding:24px 8px;font-size:12px;line-height:1.8}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.spec{background:#0a111b;border:1px solid #26384b;border-radius:12px;padding:13px;min-width:0}.spec small{display:block;color:var(--muted);margin-bottom:6px}.spec b{overflow-wrap:anywhere;white-space:pre-wrap}.detailtitle{font-size:clamp(27px,5vw,42px);margin:10px 0 4px;overflow-wrap:anywhere}.sub{color:var(--muted);margin:0 0 12px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}@media(max-width:480px){.wrap{padding:11px}.grid{grid-template-columns:1fr}.hero{padding:17px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.detailgrid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">زكي فون <span>| ZAKI PHONE</span></div><a class="btn" href="catalog.html">الرجوع للكتالوج</a></header><section class="hero" id="content"><p>جارٍ تحميل تفاصيل الهاتف…</p></section><footer class="foot">الأسعار تقريبية، والمعلومات غير المتوفرة موضحة بوضوح.</footer></main><script>
const $=id=>document.getElementById(id);
const brandNames={Apple:'Apple',Samsung:'Samsung',Xiaomi:'Xiaomi / Redmi / POCO',OPPO:'OPPO',realme:'realme',vivo:'vivo / iQOO',Infinix:'Infinix',HUAWEI:'HUAWEI'};
function field(p,...keys){if(!p)return undefined;for(const key of keys){const variants=[key,key.replace(/_/g,' '),key.replace(/ /g,'_')];for(const k of variants){const v=p[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v;}}return undefined}
function money(v){if(v===undefined||v===null||v===''||!Number.isFinite(Number(v))||Number(v)<=0)return 'غير متوفر';return Number(v).toLocaleString('ar-EG')+' جنيه'}
function prices(p){const current=field(p,'current_new_price_egp','current_price_egp','egypt_price_egp','egypt price egp','price_egp','price');const launch=field(p,'launch_price_egp','launch price egp');return {current,launch}}
function priceBoxes(p,compact=false){const v=prices(p);return `<div class="prices ${compact?'compact':''}"><div class="pricebox"><small>السعر التقريبي (الجديد أو عند الإطلاق)</small><b>${money(v.current)}</b></div><div class="pricebox"><small>سعر الإطلاق التقريبي</small><b>${money(v.launch)}</b></div></div>`}
function normalizeSearch(value){return String(value??'').toLowerCase().normalize('NFKC').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim()}
function getYear(p){return field(p,'release_year','announcement_year','release year','announcement year')}

const params=new URLSearchParams(location.search);
function makePhoneImage(brand,model,series){const prefixes={Apple:'apple',Samsung:'samsung',Xiaomi:'xiaomi',Redmi:'xiaomi',POCO:'poco',OPPO:'oppo',realme:'realme',vivo:'vivo',Infinix:'infinix',HUAWEI:'huawei',Honor:'honor',OnePlus:'oneplus',Motorola:'motorola',Google:'google',Nokia:'nokia',Tecno:'tecno'};let n=model||'';if(series&&brand!=='Apple'&&!n.toLowerCase().includes(series.toLowerCase()))n=series+' '+n;let slug=n.toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return 'https://fdn2.gsmarena.com/vv/bigpic/'+(prefixes[brand]||brand.toLowerCase())+'-'+slug+'.jpg'}
const im=document.getElementById('phoneImage');if(im){const brand=params.get('brand')||'',model=params.get('model')||'',series=params.get('series')||'';im.src=makePhoneImage(brand,model,series);im.onerror=()=>{im.style.display='none';const a=document.getElementById('imageSearch');if(a){a.href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(brand+' '+model+' phone official image');a.style.display='block'}}}fetch('./phones.json?v=20261014-ar692',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{const all=Array.isArray(data)?data:(data.phones||data.data||[]);const brand=params.get('brand')||'',model=params.get('model')||'',series=params.get('series')||'',year=params.get('year')||'';let p=all.find(x=>String(field(x,'brand')||'')===brand&&String(field(x,'model')||'')===model&&String(field(x,'series')||'')===series&&String(getYear(x)||'')===year)||all.find(x=>String(field(x,'brand')||'')===brand&&String(field(x,'model')||'')===model&&String(field(x,'series')||'')===series);if(!p){$('content').innerHTML='<h1>لم نعثر على الهاتف</h1><p>ارجع للكتالوج واختر الهاتف مرة أخرى.</p><a class="btn" href="catalog.html">العودة للكتالوج</a>';return}document.title=(field(p,'display_name_ar')||field(p,'model')||'تفاصيل الهاتف')+' | زكي فون';const specs=[['الشركة',field(p,'brand')],['سنة الإعلان',field(p,'announcement_year','announcement year')],['سنة الإصدار',field(p,'release_year','release year')],['الشبكة',field(p,'network')],['الشاشة',field(p,'display')],['دقة الشاشة',field(p,'display_resolution','display resolution')],['معدل التحديث',field(p,'refresh_rate_hz','refresh rate hz')],['المعالج',field(p,'chipset')],['الكاميرات',field(p,'cameras')],['تفاصيل الكاميرات الخلفية',field(p,'rear_camera_details','rear camera details')],['الكاميرا الأمامية',field(p,'front_camera_details','front camera details')],['البطارية',field(p,'battery')],['قدرة الشحن',field(p,'charging_w','charging w')],['الذاكرة والتخزين',field(p,'storage_options','storage options')],['نظام التشغيل عند الإطلاق',field(p,'os_at_launch','os at launch')],['مقاومة الماء',field(p,'water_resistance','water resistance')],['الاتصال',field(p,'connectivity')],['الأبعاد',field(p,'dimensions')],['الوزن',field(p,'weight_g','weight g')],['الألوان',field(p,'colors')],['حالة التحقق',field(p,'verification_status','verification status')]];const esc=v=>String(v===undefined||v===null||String(v).trim()===''?'غير متوفر':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('content').innerHTML=`<span class="brand">${esc(brandNames[field(p,'brand')]||field(p,'brand'))}</span><h1 class="detailtitle">${esc(field(p,'display_name_ar')||field(p,'model'))}</h1><p class="sub">${esc(field(p,'series')||'')}</p><h2>الأسعار التقريبية في مصر</h2>${priceBoxes(p)}<img id="phoneImage" class="phone-photo" style="max-width:360px;height:300px;margin:14px auto" alt="صورة الهاتف"><a id="imageSearch" class="photo-search" target="_blank" rel="noopener" style="display:none">ابحث عن الصورة الأصلية</a><div class="detailgrid">${specs.map(([label,value])=>`<div class="spec"><small>${label}</small><b>${esc(value)}</b></div>`).join('')}</div><div class="note">الأسعار تقديرية وقد تختلف حسب الحالة والسعة والتوافر والضمان. إذا ظهر «غير متوفر» فهذا يعني أن الحقل فارغ أو غير معروف في قاعدة البيانات، وليس أن الهاتف لا يدعم الميزة.</div>`;const detailImg=document.getElementById('phoneImage');if(detailImg){detailImg.src=field(p,'image_url','image','img')||makePhoneImage(brand,model,series);detailImg.onerror=()=>{detailImg.style.display='none';const link=document.getElementById('imageSearch');if(link){link.href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(brand+' '+model+' phone official image');link.style.display='block'}}}}).catch(e=>{$('content').innerHTML='<h1>تعذر تحميل البيانات</h1><p>تأكد من وجود phones.json بجانب هذه الصفحة.</p>';console.error(e)});
</script></body></html>
